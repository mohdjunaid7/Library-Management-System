# ===== Server =====
server.port=8080

# ===== MySQL Database Connection =====
# 1. Create the database first: CREATE DATABASE library_db;
# 2. Update username/password below to match your MySQL installation.
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Nagendra@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update = creates/updates tables automatically from the entity classes on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Multipart (not required, kept small) =====
spring.servlet.multipart.max-file-size=2MB
