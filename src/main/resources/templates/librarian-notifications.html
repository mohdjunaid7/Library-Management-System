<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Send Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">📚 Librarian Panel</span>
    <div>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/dashboard}">Dashboard</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/books}">Books</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/members}">Members</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/transactions}">Transactions</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/notifications}">Notifications</a>
        <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container mt-4" style="max-width:600px;">
    <h3 class="mb-3">Send Notification</h3>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form th:action="@{/librarian/notifications/send}" method="post" class="card p-4">
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" name="toAll" id="toAll" value="true" onchange="document.getElementById('memberSelect').disabled = this.checked;">
            <label class="form-check-label" for="toAll">Send to all members</label>
        </div>
        <div class="mb-3">
            <label class="form-label">Specific Member (if not sending to all)</label>
            <select name="memberId" id="memberSelect" class="form-control">
                <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name} + ' (' + ${m.membershipId} + ')'"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea name="message" class="form-control" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Send</button>
    </form>
</div>
</body>
</html>
