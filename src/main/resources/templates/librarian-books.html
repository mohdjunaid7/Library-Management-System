<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">📚 Librarian Panel</span>
    <div>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/dashboard}">Dashboard</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/books}">Books</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/members}">Members</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/transactions}">Transactions</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/notifications}">Notifications</a>
        <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Book Catalog</h3>
        <a th:href="@{/librarian/books/new}" class="btn btn-success">+ Add Book</a>
    </div>

    <table class="table table-bordered bg-white">
        <thead class="table-dark">
        <tr>
            <th>Title</th><th>Author</th><th>ISBN</th><th>Genre</th>
            <th>Total</th><th>Available</th><th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.isbn}"></td>
            <td th:text="${book.genre}"></td>
            <td th:text="${book.totalCopies}"></td>
            <td th:text="${book.availableCopies}"></td>
            <td>
                <a th:href="@{/librarian/books/edit/{id}(id=${book.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{/librarian/books/delete/{id}(id=${book.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete this book?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
