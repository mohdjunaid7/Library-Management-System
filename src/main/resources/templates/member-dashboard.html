<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">📚 My Library</span>
    <div>
        <a class="btn btn-outline-light btn-sm" th:href="@{/member/dashboard}">Dashboard</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/books}">Search Books</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/member/profile}">Profile</a>
        <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="mb-4">Welcome, <span th:text="${user.name}">Member</span> 👋
        <small class="text-muted" style="font-size:1rem;" th:text="'(' + ${user.membershipId} + ')'"></small>
    </h3>

    <div class="row">
        <div class="col-md-7">
            <h5>Borrowing History</h5>
            <table class="table table-bordered bg-white">
                <thead class="table-dark">
                <tr><th>Book</th><th>Issued</th><th>Due</th><th>Returned</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody>
                <tr th:each="t : ${history}">
                    <td th:text="${t.book.title}"></td>
                    <td th:text="${t.issueDate}"></td>
                    <td th:text="${t.dueDate}"></td>
                    <td th:text="${t.returnDate} ?: '-'"></td>
                    <td>
                        <span class="badge" th:classappend="${t.status.name() == 'OVERDUE'} ? 'badge-overdue' : (${t.status.name() == 'ISSUED'} ? 'badge-issued' : 'badge-returned')"
                              th:text="${t.status}"></span>
                    </td>
                    <td>
                        <form th:if="${t.returnDate == null}" th:action="@{/member/return/{id}(id=${t.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-success">Return</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(history)}"><td colspan="6" class="text-center text-muted">No books borrowed yet</td></tr>
                </tbody>
            </table>
        </div>

        <div class="col-md-5">
            <h5>Notifications</h5>
            <div class="list-group">
                <div th:each="n : ${notifications}" class="list-group-item" th:classappend="${n.read} ? '' : 'list-group-item-warning'">
                    <p class="mb-1" th:text="${n.message}"></p>
                    <small class="text-muted" th:text="${n.createdAt}"></small>
                    <form th:if="${!n.read}" th:action="@{/member/notifications/read/{id}(id=${n.id})}" method="post" class="d-inline float-end">
                        <button type="submit" class="btn btn-sm btn-link p-0">Mark read</button>
                    </form>
                </div>
                <div th:if="${#lists.isEmpty(notifications)}" class="text-muted">No notifications</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
