<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">📚 My Library</span>
    <div>
        <a class="btn btn-outline-light btn-sm" th:href="@{/member/dashboard}">Dashboard</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/books}">Search Books</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/member/profile}">Profile</a>
        <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="mb-3">Search Books</h3>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/books}" method="get" class="d-flex mb-4">
        <input type="text" name="query" th:value="${query}" class="form-control me-2" placeholder="Search by title, author, or genre">
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <div class="row">
        <div class="col-md-4 mb-3" th:each="book : ${books}">
            <div class="card p-3">
                <h5 th:text="${book.title}"></h5>
                <p class="mb-1 text-muted" th:text="'by ' + ${book.author}"></p>
                <p class="mb-1"><span class="badge bg-secondary" th:text="${book.genre}"></span></p>
                <p class="mb-2" th:text="${book.availableCopies} + ' of ' + ${book.totalCopies} + ' copies available'"></p>
                <form th:action="@{/member/borrow/{id}(id=${book.id})}" method="post">
                    <button type="submit" class="btn btn-success w-100" th:disabled="${book.availableCopies == 0}">
                        <span th:text="${book.availableCopies == 0} ? 'Not Available' : 'Borrow'"></span>
                    </button>
                </form>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(books)}" class="text-muted">No books found.</div>
    </div>
</div>
</body>
</html>
