<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Members</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">📚 Librarian Panel</span>
    <div>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/dashboard}">Dashboard</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/books}">Books</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/members}">Members</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/transactions}">Transactions</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/notifications}">Notifications</a>
        <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Members</h3>
        <a th:href="@{/librarian/members/new}" class="btn btn-success">+ Add Member</a>
    </div>

    <table class="table table-bordered bg-white">
        <thead class="table-dark">
        <tr><th>Membership ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="member : ${members}">
            <td th:text="${member.membershipId}"></td>
            <td th:text="${member.name}"></td>
            <td th:text="${member.email}"></td>
            <td th:text="${member.phone}"></td>
            <td>
                <a th:href="@{/librarian/members/delete/{id}(id=${member.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete this member?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
