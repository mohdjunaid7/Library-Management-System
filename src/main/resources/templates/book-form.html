<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 500px;">
    <div class="card p-4">
        <h4 th:text="${book.id} ? 'Edit Book' : 'Add New Book'">Book Form</h4>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/librarian/books/save}" th:object="${book}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" th:field="*{title}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Author</label>
                <input type="text" th:field="*{author}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">ISBN</label>
                <input type="text" th:field="*{isbn}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Genre</label>
                <input type="text" th:field="*{genre}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Total Copies</label>
                <input type="number" th:field="*{totalCopies}" class="form-control" min="1" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Save</button>
            <a th:href="@{/librarian/books}" class="btn btn-link w-100">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
