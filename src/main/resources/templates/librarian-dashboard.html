<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Librarian Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">📚 Librarian Panel</span>
    <div>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/dashboard}">Dashboard</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/books}">Books</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/members}">Members</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/transactions}">Transactions</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/notifications}">Notifications</a>
        <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="mb-4">Welcome, <span th:text="${user.name}">Librarian</span> 👋</h3>

    <div class="row">
        <div class="col-md-4">
            <div class="card stat-card">
                <h2 th:text="${totalBooks}">0</h2>
                <p class="text-muted mb-0">Total Books</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card">
                <h2 th:text="${totalMembers}">0</h2>
                <p class="text-muted mb-0">Total Members</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card">
                <h2 th:text="${totalTransactions}">0</h2>
                <p class="text-muted mb-0">Total Transactions</p>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-3 mb-3"><a th:href="@{/librarian/books}" class="btn btn-primary w-100 py-3">Manage Books</a></div>
        <div class="col-md-3 mb-3"><a th:href="@{/librarian/members}" class="btn btn-primary w-100 py-3">Manage Members</a></div>
        <div class="col-md-3 mb-3"><a th:href="@{/librarian/transactions}" class="btn btn-primary w-100 py-3">Transactions</a></div>
        <div class="col-md-3 mb-3"><a th:href="@{/librarian/notifications}" class="btn btn-primary w-100 py-3">Send Notification</a></div>
    </div>
</div>
</body>
</html>
