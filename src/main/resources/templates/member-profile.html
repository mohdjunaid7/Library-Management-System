<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">📚 My Library</span>
    <div>
        <a class="btn btn-outline-light btn-sm" th:href="@{/member/dashboard}">Dashboard</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/books}">Search Books</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/member/profile}">Profile</a>
        <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container mt-4" style="max-width:500px;">
    <h3 class="mb-3">My Profile</h3>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form th:action="@{/member/profile}" method="post" class="card p-4">
        <div class="mb-3">
            <label class="form-label">Membership ID</label>
            <input type="text" class="form-control" th:value="${user.membershipId}" disabled>
        </div>
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" th:value="${user.name}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:value="${user.email}" disabled>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control" th:value="${user.phone}">
        </div>
        <div class="mb-3">
            <label class="form-label">New Password (leave blank to keep current)</label>
            <input type="password" name="password" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary w-100">Update Profile</button>
    </form>
</div>
</body>
</html>
