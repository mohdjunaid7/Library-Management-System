<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">📚 Librarian Panel</span>
    <div>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/dashboard}">Dashboard</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/books}">Books</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/members}">Members</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/transactions}">Transactions</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/librarian/notifications}">Notifications</a>
        <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <h3 class="mb-3">Borrow / Return Transactions</h3>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-bordered bg-white">
        <thead class="table-dark">
        <tr><th>Book</th><th>Member</th><th>Issue Date</th><th>Due Date</th><th>Return Date</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody>
        <tr th:each="t : ${transactions}">
            <td th:text="${t.book.title}"></td>
            <td th:text="${t.member.name}"></td>
            <td th:text="${t.issueDate}"></td>
            <td th:text="${t.dueDate}"></td>
            <td th:text="${t.returnDate} ?: '-'"></td>
            <td>
                <span class="badge" th:classappend="${t.status.name() == 'OVERDUE'} ? 'badge-overdue' : (${t.status.name() == 'ISSUED'} ? 'badge-issued' : 'badge-returned')"
                      th:text="${t.status}"></span>
            </td>
            <td>
                <form th:if="${t.returnDate == null}" th:action="@{/librarian/transactions/return/{id}(id=${t.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-success">Mark Returned</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
